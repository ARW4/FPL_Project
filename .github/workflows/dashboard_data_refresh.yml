name: dashboard_data_refresh

on:
   workflow_dispatch:

jobs:
  dashboard_refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository content
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
         install-chromedriver: true

      - name: Install Python Dependencies
        run: |
          pip install selenium
          pip install webdriver-manager
          sudo apt-get install xvfb

      - name: Run Script
        env: 
          TABLEAU_EMAIL: ${{ vars.TABLEAU_EMAIL }}
          TABLEAU_PASSWORD: ${{ vars.TABLEAU_PASSWORD }}
        run: xvfb-python dashboard_refresh_script.py

      - name: Upload page source if present
        if: always()  # Always try to upload, even if previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: page_source
          path: page_source.html
